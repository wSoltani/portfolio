  when: Released Oct 2026
  fact: Two packages on npm, free and open source (MIT).
timeline:
  - date: Oct 30, 2026
    title: Started
    body: The repo was set up under the same GitHub organization as Netherstone.
  - date: Oct 31, 2026
    title: On npm
    body: 0.1.0 went to npm with the editor, its toolbar and shortcuts, and support for adding your own Markdown syntax.
  - date: Nov 1, 2026
    title: Web component and React
    body: 0.2 added the <nether-mark> web component, the preview, touch screen support and the React package. Every label and icon can now be replaced. 0.3 followed the same day with the Netherstone app's Light and Dark colors, and 0.3.1 added multiple cursors.
  - date: Nov 2, 2026
    title: Fixed heights
    body: 0.3.2 made a height set on the editor hold, so the text scrolls inside it instead of being cut off.
