timeline:
  - date: May 28, 2026
    title: Planned, built, released
    body: "Syncify was planned and built on May 28, and v1.0.1 went out that night. The plan already set the rules it still follows: no account needed, your backup found through your Spotify account, and a full backup never replaced by an empty one. Automatic backups were switched off by default the same day."
  - date: June 2
    title: Version history
    body: v1.1.0 started keeping your last three backups instead of one, so a broken or accidental backup, or one made automatically, can't replace the only good copy. The dialog also started showing which version of Syncify you're running.
  - date: August 20
    title: Marketplace moved its data
    body: People setting up Spotify from scratch got an “empty backup” error. Marketplace had started saving its data in a different part of Spotify's storage, one that survives when Spotify resets your profile, and Syncify was still reading the old one. A Syncify user, zoltan, traced it and sent the fix, which shipped in v1.1.1.
  - date: Oct 7, 2026
    title: Spotify's new top bar
    body: A Spotify update made extension buttons vanish from the top bar for some people, Syncify's included. v1.1.2 puts the button back whenever Spotify redraws the bar, adds Syncify to the profile menu, and opens it from anywhere with Ctrl+Alt+S (⌘⌥S on a Mac).
  - date: Oct 24, 2026
    title: See before you restore
    body: A day of releases moved Syncify to a loader that updates it whenever Spotify starts, with a beta channel. Backups began keeping a safety copy and your Spicetify config, and a restore now shows what it will change first.
  - date: Oct 25, 2026
    title: Accounts
    body: 1.8 added an optional account, with sign-in by email code. 1.9 let you secure a backup to it, so only your signed-in devices can restore it, and link more than one Spotify account.
  - date: Oct 30, 2026
    title: Share codes
    body: 1.13 added share codes. Share this setup gives you a code anyone can load, and your handle shows on what you share.
  - date: Nov 1, 2026
    title: Discover
    body: 1.15 opened Discover on the website, where people share setups and heart the ones they like. The Syncify Discord followed the next day.
