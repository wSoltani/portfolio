timeline:
  - date: Apr 16, 2026
    title: First project files
    body: Netherstone started on April 16 with a plain Markdown editor. Two days later Plate replaced it, and the rest of the month went into making it fast, along with the browser panel, Excalidraw drawings and recent shards in the sidebar.
  - date: End of May
    title: Paused
    body: May brought @ mentions in place of wikilinks, and a canvas mode for drawing. Large shards were still slow to open, because the rich editor draws every block. A workaround that loaded shards a little at a time stayed janky, so the project went on hold.
  - date: June
    title: Plate's update
    body: Plate 53.0.7 came out on June 3 and made large documents load about 2.7 times faster.
  - date: September
    title: Picked back up
    body: Back on it, Netherstone moved to Plate 53 and split each shard into groups of 100 blocks, so the ones off screen aren't drawn. Git sync, attachments and drawings saved in the vault came in the same stretch.
  - date: Oct 4, 2026
    title: Public beta
    body: Netherstone 0.1.0 beta 1 went public on October 4, with first-run onboarding and updates from GitHub releases. Beta 2 followed two days later with folders in the sidebar.
  - date: Oct 7, 2026
    title: Export and themes
    body: "0.2 added export to PDF, Word and web pages, and three new themes: Tyrant, Bloodline and Citadel. Its second beta let you drag shards into folders and turned the table of contents into an Outline."
  - date: Oct 16, 2026
    title: A new layout
    body: 0.3 rebuilt the layout around a rail for Editor, Tags and Canvas, a sidebar with Pinned and Recent shards, and a right sidebar with Outline, Links and Details. The whole interface can be zoomed too.
  - date: Oct 21, 2026
    title: Vault health
    body: 0.4 was about the health of a vault. Every shard and drawing keeps its earlier versions, Overview shows a writing calendar, charts from tables and broken links, and Import brings in Word, PDF, web pages and CSV. Beta 2 followed on October 24.
  - date: Oct 25, 2026
    title: Gallery and history
    body: 0.5 added a Gallery of every attachment in a vault. History now saves a version every ten minutes while you write, shows which device made each one, and can free up the space old attachment versions take. Big files copy in without holding up saves.
  - date: Oct 27, 2026
    title: AI apps
    body: "0.6 added a built-in MCP server, so AI apps can work in a vault. It's off until you turn it on, and you pick which vaults an app can use. Every change an app makes is saved in History first, and apps can't delete anything. Keyboard shortcuts can now be changed in Settings. Beta 2 followed on October 28 and opens files and folders from the terminal or the file manager."
  - date: Nov 1, 2026
    title: Diagrams and installers
    body: 0.6 beta 3 draws Mermaid code blocks as diagrams and shows embeds in the editor. Zip files import like folders. It was also the first release published to Homebrew.
