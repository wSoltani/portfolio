  x: 585
  y: 175
resume:
  when: Public beta since Sep 2026
  fact: Exports render frame by frame, so they never drop a frame or drift out of sync.
tour:
  - name: Avatar
    line: Upload any image, crop it, and pick the shape of its frame.
    image: ./Avatar.webp
    hl: [ 713, 14, 850, 480 ]
    spots:
      - { x: 739, y: 50, side: l, text: "Replace the image, or crop it again to reframe it" }
      - { x: 731, y: 101, side: l, text: "Circle, square, rectangle or triangle. The crop matches the shape you pick" }
      - { x: 729, y: 181, side: l, text: Size and position inside the frame }
      - { x: 729, y: 230, side: l, text: An optional border }
  - name: Halo
    line: A ring around your avatar that glows and pulses as you speak.
    image: ./Halo.webp
    hl: [ 713, 14, 850, 480 ]
    spots:
      - { x: 736, y: 82, side: l, text: "Gap from the avatar, and thickness" }
      - { x: 727, y: 153, side: l, text: "How much it grows, and how it fades between resting and peak as you speak" }
      - { x: 724, y: 247, side: l, text: "Any color, with an adjustable glow" }
  - name: Mouth
    line: A spectrum analyzer you drag onto your avatar's face.
    image: ./Mouth.webp
    spots:
      - { x: 353, y: 331, side: b, text: "Drag the mouth into place on the stage, or type exact numbers in the panel" }
      - { x: 724, y: 175, side: l, text: "Number of bars, spacing, rounding and resting height" }
      - { x: 724, y: 265, side: l, text: "Mirrored: low frequencies in the middle, fanning out to both sides" }
      - { x: 724, y: 378, side: l, text: A soft backdrop keeps the bars readable over a busy image }
  - name: Audio
    line: Tune it to your voice with two sliders.
    image: ./Audio.webp
    hl: [ 713, 14, 850, 480 ]
    spots:
      - { x: 720, y: 44, side: l, text: "The live level meter, with the noise gate and ceiling drawn on it" }
      - { x: 722, y: 89, side: l, text: "Follow your microphone, a speech-like test signal, or an audio file" }
      - { x: 720, y: 179, side: l, text: "Set the gate just above your silence, and the ceiling near your speaking peaks" }
      - { x: 720, y: 269, side: l, text: "How fast the halo and mouth react, and how fast they settle" }
      - { x: 720, y: 349, side: l, text: "Which frequencies count, and how smooth the movement is" }
  - name: Stage
    line: The background, and how the avatar itself moves.
    image: ./Stage.webp
    hl: [ 713, 14, 850, 480 ]
    spots:
      - { x: 720, y: 60, side: l, text: "No background, black, green, or a color of your own. The checkerboard only shows while you edit" }
      - { x: 720, y: 185, side: l, text: "Bounce, sway and pop with your voice. Off by default" }
      - { x: 720, y: 252, side: l, text: Cap the frame rate if OBS only captures at 60 fps }
      - { x: 720, y: 316, side: l, text: "Warns you if the mic fails inside OBS, instead of showing a silent avatar" }
  - name: Stream to OBS
    line: One switch, and your avatar is ready for OBS.
    image: ./Output1.webp
    hl: [ 713, 14, 850, 480 ]
    spots:
      - { x: 836, y: 54, side: l, text: Serves your avatar on a local address on your computer }
      - { x: 722, y: 85, side: l, text: Copy this into an OBS Browser Source. OBS needs no launch flags or mic permission }
  - name: Make a video
    line: Load an audio file and export a finished video with your look.
    image: ./Output2.webp
    spots:
      - { x: 202, y: 464, side: t, text: "The audio file plays on the stage. Space pauses, and you can scrub along the waveform" }
      - { x: 720, y: 120, side: l, text: "Square, 16:9 or 9:16" }
      - { x: 720, y: 161, side: l, text: "30 or 60 fps, MP4 or WebM. WebM keeps a transparent background" }
      - { x: 720, y: 212, side: l, text: "Renders frame by frame, so it never drops a frame or drifts out of sync" }
  - name: Profiles
    line: Keep several looks, and switch between them.
    image: ./Profile.webp
    spots:
      - { x: 37, y: 27, side: r, text: Switch profiles right from the stage }
      - { x: 720, y: 58, side: l, text: OBS always shows the selected profile }
      - { x: 720, y: 111, side: l, text: "Create, duplicate, rename or delete" }
      - { x: 720, y: 170, side: l, text: "Export a profile and its image as one file, to back it up or move it to another computer" }
timeline:
  - date: Sep 20–30, 2026
    title: A page inside OBS
    body: The first Yapora was a web page loaded into OBS as a Browser Source, with the avatar drawn so it stays sharp at any size. It worked, but OBS never asks for microphone access, so you had to relaunch OBS with special flags and keep a terminal window open while you streamed.
  - date: Sep 30
    title: A desktop app
    body: The same night it became a Windows app. Yapora started reading the microphone itself and streaming the avatar to OBS, so OBS needed no flags or permissions. Profiles, audio files and video export came with it, and v0.0.1 beta went public that morning.
  - date: Oct 3, 2026
    title: Transparent videos
    body: v0.0.2 let WebM exports keep a transparent background, so the avatar drops straight over other footage in OBS or a video editor. MP4 can't store transparency, so it still exports as green screen, and the export panel tells you which one you'll get.
